name: Craft spec from transaction

on:
  workflow_dispatch:
    inputs:
      chain_id:
        description: "Chain ID (decimal, e.g. 1, 100, 11155111)"
        required: true
      safe_address:
        description: "Safe address (0x...)"
        required: true
      safe_tx_hash:
        description: "SafeTxHash (the SafeTx struct hash, not the on-chain tx hash)"
        required: true
      verdict:
        description: "Expected verdict"
        required: true
        type: choice
        options:
          - secure
          - insecure
      category:
        description: "Spec category, i.e. the specs/<category> folder to write into"
        required: true
      rule_id:
        description: 'Charter rule citation, e.g. "R-4.3" (required when verdict is insecure)'
        required: false
      note:
        description: "Optional prose explaining the rationale behind the verdict"
        required: false

permissions:
  contents: read

jobs:
  craft-spec:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Craft spec
        id: craft
        env:
          RPC_URLS: ${{ secrets.RPC_URLS }}
          CHAIN_ID: ${{ inputs.chain_id }}
          SAFE_ADDRESS: ${{ inputs.safe_address }}
          SAFE_TX_HASH: ${{ inputs.safe_tx_hash }}
          VERDICT: ${{ inputs.verdict }}
          CATEGORY: ${{ inputs.category }}
          RULE_ID: ${{ inputs.rule_id }}
          NOTE: ${{ inputs.note }}
        run: |
          args=(
            --chain-id "$CHAIN_ID"
            --safe "$SAFE_ADDRESS"
            --safe-tx-hash "$SAFE_TX_HASH"
            --verdict "$VERDICT"
            --category "$CATEGORY"
          )
          [[ -n "$RULE_ID" ]] && args+=(--rule "$RULE_ID")
          [[ -n "$NOTE" ]] && args+=(--note "$NOTE")

          path="$(./bin/craft-spec.sh "${args[@]}")"
          echo "spec_path=$path" >>"$GITHUB_OUTPUT"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN_ID: ${{ inputs.chain_id }}
          SAFE_ADDRESS: ${{ inputs.safe_address }}
          SAFE_TX_HASH: ${{ inputs.safe_tx_hash }}
          VERDICT: ${{ inputs.verdict }}
          CATEGORY: ${{ inputs.category }}
          RULE_ID: ${{ inputs.rule_id }}
        run: |
          branch="craft-spec/${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add specs
          if git diff --cached --quiet; then
            echo "No changes under specs/ to open a PR for."
            exit 0
          fi

          git checkout -b "$branch"
          git commit -m "Add spec from ${SAFE_TX_HASH}"
          git push origin "$branch"

          gh pr create \
            --title "Add ${CATEGORY} spec: ${VERDICT} (${SAFE_TX_HASH})" \
            --body "$(cat <<EOF
          Auto-generated by the [craft-spec workflow](../actions/workflows/craft-spec.yml) from an on-chain Safe transaction.

          - Chain ID: \`${CHAIN_ID}\`
          - Safe: \`${SAFE_ADDRESS}\`
          - SafeTxHash: \`${SAFE_TX_HASH}\`
          - Verdict: \`${VERDICT}\`
          - Rule: \`${RULE_ID:-n/a}\`

          Please review the crafted spec — especially the verdict and rule citation, neither of
          which can be derived from the chain — before merging.
          EOF
          )"
