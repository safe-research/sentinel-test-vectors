name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shell scripts
        run: |
          bash -n bin/*.sh lib/common.sh
          shellcheck bin/*.sh lib/common.sh

      - name: specs
        run: |
          ./bin/check-specs.sh

      - name: tests
        run: |
          ./bin/test-sentinel.py &
          engine=$!
          trap 'kill "$engine"' EXIT
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 \
            -o /dev/null http://127.0.0.1:5473/health
          ./bin/run-tests.sh --parallel=4
