name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shell scripts
        run: |
          bash -n bin/*.sh lib/common.sh
          shellcheck bin/*.sh lib/common.sh

      - name: specs
        run: |
          ./bin/check-specs.sh
